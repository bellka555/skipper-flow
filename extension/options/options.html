<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle">Skipper Flow</title>
    <link rel="stylesheet" href="../common/theme.css" />
    <style>
      body {
        min-height: 100vh;
        background-attachment: fixed;
      }
      .page {
        position: relative;
        z-index: 1;
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .card {
        padding: 20px 22px;
        margin-bottom: 14px;
      }
      .card h2 {
        margin-bottom: 14px;
      }
      .field + .field {
        margin-top: 18px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 550;
      }
      input[type='text'],
      input[type='password'],
      textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        background: var(--glass);
        color: var(--text);
        font: inherit;
        outline: none;
        transition: border-color 0.2s, background 0.2s;
      }
      input::placeholder {
        color: var(--muted);
      }
      textarea {
        resize: vertical;
      }
      input:focus,
      textarea:focus {
        border-color: var(--accent);
        background: var(--glass-strong);
      }
      .hint {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .actions .btn {
        padding: 9px 16px;
        font-size: 13px;
      }
      .btn.primary {
        border-color: transparent;
        background: var(--switch-on);
        color: #111;
      }
      .credits {
        margin-top: 28px;
        font-size: 12px;
        color: var(--muted);
      }
      .credits a {
        color: var(--muted);
      }
      #saved {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 data-i18n="optionsHeading"></h1>
      <p class="lead" data-i18n="optionsLead"></p>

      <section class="glass card">
        <h2 data-i18n="ownKeyTitle"></h2>
        <div class="field">
          <label for="apiKey" data-i18n="apiKeyLabel"></label>
          <input type="password" id="apiKey" placeholder="sk-or-v1-…" autocomplete="off" />
          <p class="hint" data-i18n="apiKeyHint"></p>
        </div>
        <div class="field">
          <label for="model" data-i18n="modelLabel"></label>
          <input type="text" id="model" list="model-list" placeholder="nvidia/nemotron-3-super-120b-a12b:free" />
          <!-- Подсказки для поля «Модель». Через OpenRouter одним ключом доступны модели разных компаний.
               ID сверены со списком openrouter.ai/models (октябрь 2026). label — что видно в выпадающем списке. -->
          <datalist id="model-list">
            <option value="nvidia/nemotron-3-super-120b-a12b:free" label="Nemotron 3 Super (free)"></option>
            <option value="nvidia/nemotron-3-super-120b-a12b" label="Nemotron 3 Super"></option>
            <option value="anthropic/claude-haiku-5.5" label="Claude Haiku 5.5"></option>
            <option value="anthropic/claude-sonnet-5.5" label="Claude Sonnet 5.5"></option>
            <option value="openai/gpt-6-luna-pro" label="GPT-6 Luna Pro"></option>
            <option value="openai/gpt-6.1-sol" label="GPT-6.1 Sol"></option>
            <option value="google/gemini-3.8-flash" label="Gemini 3.8 Flash"></option>
            <option value="google/gemma-4-31b-it:free" label="Gemma 4 31B (free)"></option>
          </datalist>
          <p class="hint" data-i18n="modelHint"></p>
        </div>
      </section>

      <section class="glass card">
        <h2 data-i18n="serverTitle"></h2>
        <div class="field">
          <label for="backendUrl" data-i18n="backendLabel"></label>
          <input type="text" id="backendUrl" placeholder="https://skipper-flow-api.bellka.workers.dev" />
          <p class="hint" data-i18n="backendHint"></p>
        </div>
      </section>

      <section class="glass card">
        <h2 data-i18n="streamerMode"></h2>
        <div class="field">
          <label for="customWords" data-i18n="customWordsLabel"></label>
          <textarea id="customWords" rows="3" data-i18n-placeholder="customWordsPlaceholder"></textarea>
          <p class="hint" data-i18n="customWordsHint"></p>
        </div>
      </section>

      <div class="actions">
        <button class="btn primary" id="save" data-i18n="save"></button>
        <button class="btn" id="clear-key" data-i18n="clearKey"></button>
        <button class="btn" id="clear-cache" data-i18n="clearCache"></button>
        <span id="saved"></span>
      </div>

      <!-- Указание авторства обязательно по лицензии данных SponsorBlock (CC BY-NC-SA 4.0) -->
      <p class="credits">
        <span data-i18n="creditsBefore"></span>
        <a href="https://sponsor.ajay.app/" target="_blank" rel="noopener">SponsorBlock</a>
        (<span data-i18n="creditsLicense"></span>
        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>).
      </p>
    </main>

    <script src="../common/settings.js"></script>
    <script src="../common/i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
