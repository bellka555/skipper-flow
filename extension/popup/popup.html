<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Общий стиль (темы, стекло, переключатели), потом стили именно popup -->
    <link rel="stylesheet" href="../common/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <!-- preload: пока настройки не загружены, переключатели без анимации (см. popup.css и popup.js) -->
  <body class="preload">
    <main class="app">
      <!-- Шапка: название и главный выключатель всего пропуска.
           wave — по рамке бежит светлая волна, lit (у карточек ниже) — рамка ровно светится. -->
      <label class="glass header wave">
        <img class="logo" src="../icons/icon.svg" alt="" />
        <span class="brand">
          <span class="title">Skipper Flow</span>
          <span class="subtitle" id="master-label"></span>
        </span>
        <span class="switch big">
          <input type="checkbox" id="enabled" data-i18n-aria-label="masterAria" />
          <span class="slider"></span>
        </span>
      </label>

      <!-- Выключатели по типам -->
      <section class="glass card lit">
        <h2 data-i18n="whatToSkip"></h2>
        <label class="toggle-row">
          <span class="type-dot" style="--c: var(--c-sponsor)"></span>
          <span class="toggle-label" data-i18n="typeSponsor"></span>
          <span class="switch"><input type="checkbox" data-type="sponsor" /><span class="slider"></span></span>
        </label>
        <label class="toggle-row">
          <span class="type-dot" style="--c: var(--c-selfpromo)"></span>
          <span class="toggle-label" data-i18n="typeSelfpromo"></span>
          <span class="switch"><input type="checkbox" data-type="selfpromo" /><span class="slider"></span></span>
        </label>
        <label class="toggle-row">
          <span class="type-dot" style="--c: var(--c-interaction)"></span>
          <span class="toggle-label" data-i18n="typeInteraction"></span>
          <span class="switch"><input type="checkbox" data-type="interaction" /><span class="slider"></span></span>
        </label>
      </section>

      <!-- Режим стримера: глушит запрещённые слова. Работает отдельно от пропуска рекламы.
           Классы is-on и lit ставит popup.js, когда режим включён. -->
      <section class="glass card streamer standalone" id="streamer-card">
        <div class="card-head">
          <h2 data-i18n="streamerMode"></h2>
          <span class="switch"><input type="checkbox" id="streamer-enabled" data-i18n-aria-label="streamerMode" /><span class="slider"></span></span>
        </div>
        <div class="streamer-options">
          <label class="toggle-row">
            <span class="type-dot" style="--c: #ff4d4f"></span>
            <span class="toggle-label">
              <span data-i18n="slurs"></span>
              <small class="toggle-note" data-i18n="slursNote"></small>
            </span>
            <span class="switch"><input type="checkbox" data-streamer="slurs" /><span class="slider"></span></span>
          </label>
          <label class="toggle-row">
            <span class="type-dot" style="--c: #ff8a4d"></span>
            <span class="toggle-label" data-i18n="profanity"></span>
            <span class="switch"><input type="checkbox" data-streamer="profanity" /><span class="slider"></span></span>
          </label>
          <label class="toggle-row">
            <span class="toggle-label" data-i18n="beep"></span>
            <span class="switch"><input type="checkbox" data-streamer="beep" /><span class="slider"></span></span>
          </label>
          <label class="toggle-row">
            <span class="toggle-label">
              <span data-i18n="warnAhead"></span>
              <small class="toggle-note" data-i18n="warnAheadNote"></small>
            </span>
            <span class="switch"><input type="checkbox" data-streamer="warn" /><span class="slider"></span></span>
          </label>
          <p class="status muted" id="streamer-status"></p>
          <p class="hint" data-i18n="streamerHint"></p>
        </div>
      </section>

      <!-- Статус текущего видео и список найденных сегментов -->
      <section class="glass card lit">
        <div class="card-head">
          <h2 data-i18n="currentVideo"></h2>
          <span class="badge" id="source" hidden></span>
        </div>
        <p class="status" id="status" data-i18n="loading"></p>
        <ul class="segments" id="segments"></ul>
      </section>

      <!-- «Найти главное»: по кнопке ИИ находит ключевые моменты видео. Тоже не зависит от пропуска рекламы. -->
      <section class="glass card lit standalone" id="highlights-card" hidden>
        <div class="card-head">
          <h2 data-i18n="highlightsTitle"></h2>
          <button class="btn" id="find-highlights" data-i18n="findHighlights"></button>
        </div>
        <!-- Главы от автора (из таймкодов в описании) — показываем сразу, без ИИ -->
        <p class="subhead" id="chapters-head" hidden></p>
        <ul class="segments chapters-list" id="chapters-list"></ul>
        <!-- Результат кнопки «Найти главное» -->
        <p class="subhead" id="ai-head" data-i18n="aiHighlightsHead" hidden></p>
        <p class="status muted" id="highlights-status"></p>
        <ul class="segments" id="highlights-list"></ul>
      </section>

      <!-- «Чистый режим»: всё работает, но на шкале видео нет цветных меток -->
      <section class="glass card lit standalone">
        <label class="toggle-row">
          <span class="toggle-label">
            <span data-i18n="cleanMode"></span>
            <small class="toggle-note" data-i18n="cleanModeNote"></small>
          </span>
          <span class="switch"><input type="checkbox" id="clean-mode" /><span class="slider"></span></span>
        </label>
      </section>

      <footer class="footer">
        <a href="#" id="open-options" data-i18n="settingsLink"></a>
      </footer>
    </main>

    <!-- Сначала общие файлы (настройки и переводы), потом код popup -->
    <script src="../common/settings.js"></script>
    <script src="../common/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
